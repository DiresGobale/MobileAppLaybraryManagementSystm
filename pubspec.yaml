name: iulms
description: "Injibara University Library Management System - A Flutter mobile application for managing library operations, book inventory, borrowing, and returns."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.0
  path: ^1.8.3
  provider: ^6.1.1
  intl: ^0.18.1
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.4
  flutter_spinkit: ^5.2.0
  path_provider: ^2.1.2
  share_plus: ^7.2.1
  flutter_tts: ^3.8.5
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/hero_panorama.png
    - assets/images/hero_panorama_2.png
    - assets/images/hero_panorama_3.png
    - assets/images/library_1.jpg
    - assets/images/library_2.jpg
    - assets/images/library_3.jpg
    - assets/images/library_4.jpg
    - assets/images/students_1.jpg
    - assets/images/students_2.jpg
    - assets/images/students_3.jpg
    - assets/images/students_4.jpg
    - assets/images/books_1.jpg
    - assets/images/books_2.jpg
    - assets/images/books_3.jpg
    - assets/images/books_4.jpg
    - assets/images/librarian_1.jpg
    - assets/images/librarian_2.jpg
    - assets/images/librarian_3.png
